name: flutter_zxing
description: A barcode scanner and generator natively in Flutter with Dart FFI based on ZXing.
version: 2.2.1
repository: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_zxing/tree/master/ohos

environment:
  sdk: '>=3.3.3 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  camera:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/camera/camera/"
      ref: br_camera-v0.11.1_ohos
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  image: ^4.1.0
  image_picker:
    git:
      url: "https://gitcode.com/openharmony-tpc/flutter_packages.git"
      path: "packages/image_picker/image_picker"

dev_dependencies:
  ffigen: ">=12.0.0 <20.0.0" # dart run ffigen --config ffigen.yaml
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  melos: ">=5.0.0 <8.0.0"

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      ohos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

# Publish to pub.dev
# flutter pub publish --dry-run
# flutter pub publish

# Update zxing-cpp submodule
# git submodule update --remote
